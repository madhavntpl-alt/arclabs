# Alertmanager Configuration for ARC LABS

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@arc-labs.com'
  smtp_auth_username: 'alerts@arc-labs.com'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'severity', 'device_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    # Emergency alerts - page immediately
    - match:
        severity: emergency
      receiver: 'emergency-alerts'
      continue: true
    
    # Device-specific routing
    - match_re:
        device_id: 'catalyst-mk1-.*'
      receiver: 'device-alerts'

receivers:
  - name: 'default'
    email_configs:
      - to: 'team@arc-labs.com'
        send_resolved: true
        headers:
          subject: '[ARC LABS] {{ .GroupLabels.alertname }} - {{ .GroupLabels.severity }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        send_resolved: true
        title: 'ARC LABS Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .GroupLabels.severity }}
          *Device:* {{ .GroupLabels.device_id }}
          *Message:* {{ .CommonAnnotations.message }}
        color: '{{ if eq .CommonLabels.severity "critical" }}danger{{ else if eq .GroupLabels.severity "warning" }}warning{{ else }}good{{ end }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@arc-labs.com'
        send_resolved: true
        headers:
          subject: '[CRITICAL] ARC LABS Alert: {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* CRITICAL
          *Device:* {{ .GroupLabels.device_id }}
          *Message:* {{ .CommonAnnotations.message }}
        color: 'danger'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_KEY}'
        severity: critical
        details:
          device: '{{ .GroupLabels.device_id }}'
          alert: '{{ .GroupLabels.alertname }}'

  - name: 'emergency-alerts'
    email_configs:
      - to: 'oncall@arc-labs.com, emergency@arc-labs.com'
        send_resolved: true
        headers:
          subject: '[EMERGENCY] ARC LABS Alert: {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#emergency-alerts'
        send_resolved: true
        title: '🚨🚨 EMERGENCY: {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* EMERGENCY
          *Device:* {{ .GroupLabels.device_id }}
          *Message:* {{ .CommonAnnotations.message }}
          *Action Required:* IMMEDIATE
        color: 'danger'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_KEY}'
        severity: critical
        details:
          device: '{{ .GroupLabels.device_id }}'
          alert: '{{ .GroupLabels.alertname }}'

  - name: 'device-alerts'
    email_configs:
      - to: 'devices@arc-labs.com'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#device-alerts'
        send_resolved: true
        title: 'Device Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Device:* {{ .GroupLabels.device_id }}
          *Severity:* {{ .GroupLabels.severity }}
          *Message:* {{ .CommonAnnotations.message }}
        color: '{{ if eq .GroupLabels.severity "critical" }}danger{{ else if eq .GroupLabels.severity "warning" }}warning{{ else }}good{{ end }}'

inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'device_id']

  # Inhibit info if warning is firing
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'device_id']