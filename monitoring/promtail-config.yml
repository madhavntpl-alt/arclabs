server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            container: container
            stream: stream
            log: log
      - labels:
          container:
          stream:
      - output:
          source: log

  - job_name: arc-labs-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: arc-labs-backend
          __path__: /app/logs/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            logger: logger
            module: module
            function: function
            line: line
      - labels:
          level:
          logger:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  - job_name: arc-labs-frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: arc-labs-frontend
          __path__: /app/logs/*.log

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*log

    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      - labels:
          remote_addr:
          status:
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"

  - job_name: arc-labs-firmware
    static_configs:
      - targets:
          - localhost
        labels:
          job: arc-labs-firmware
          __path__: /app/logs/firmware/*.log